[project]
name = "notion-knowledge-finder"
version = "0.1.0"
description = "A cited RAG assistant for finding company knowledge in Notion"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=1.0,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langchain>=1.0,<2",
  "langchain-google-genai>=3.0,<5",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.42,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

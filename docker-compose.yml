services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notion_finder
      POSTGRES_USER: notion
      POSTGRES_PASSWORD: notion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notion -d notion_finder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
